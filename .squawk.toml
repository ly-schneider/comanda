# squawk lints new migrations in CI (.github/workflows/ci-backend.yml).
# These rules conflict with this repo's Atlas/Ent migration style and are
# excluded so the gate stays meaningful without rejecting every migration:
#   - prefer-text-field: columns are intentionally bounded VARCHAR(n), generated
#     from the Ent schema's MaxLen; unbounded TEXT is not wanted.
#   - require-timeout-settings / prefer-robust-stmts: Atlas runs each migration
#     file in a single transaction (txmode=file) and records applied revisions,
#     so per-statement IF NOT EXISTS and manual lock/statement timeouts are
#     redundant. Every existing migration trips these; they are false positives.
#   - require-concurrent-index-creation: CREATE INDEX CONCURRENTLY cannot run
#     inside a transaction, which the single-tx-per-file migrations always use.
#   - constraint-missing-not-valid / adding-foreign-key-constraint: NOT VALID
#     followed by a separate VALIDATE needs two transactions — impossible in a
#     single migration file; at this scale the brief lock is acceptable.
#   - ban-drop-column: column removals are deliberate schema changes shipped
#     atomically with the web+backend in one deploy, so the stale-client risk
#     the rule guards against does not apply here.
#   - prefer-bigint-over-int: Ent `field.Int` generates INTEGER columns (as on the
#     existing order/order_line counts and ids); use `field.Int64` for a real BIGINT.
#   - require-enum-value-ordering: enum values are appended with `ALTER TYPE ... ADD
#     VALUE`; their positional ordering is never relied on.
#   - changing-column-type: the VARCHAR(n) caps come from Ent `MaxLen`, which is
#     occasionally raised (e.g. a longer order_line title); widening a varchar is a
#     metadata-only catalog change in Postgres — no table rewrite, only a brief lock.
excluded_rules = [
  "prefer-text-field",
  "require-timeout-settings",
  "prefer-robust-stmts",
  "require-concurrent-index-creation",
  "constraint-missing-not-valid",
  "adding-foreign-key-constraint",
  "ban-drop-column",
  "prefer-bigint-over-int",
  "require-enum-value-ordering",
  "changing-column-type",
]
