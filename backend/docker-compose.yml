name: backend

services:
  # PostgreSQL for local development (production uses db/provisioning/ for role setup)
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-comanda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/provisioning/bootstrap-rls-roles.sql:/docker-entrypoint-initdb.d/01-bootstrap-rls-roles.sql:ro
      - ./db/provisioning/docker-dev-passwords.sql:/docker-entrypoint-initdb.d/02-dev-passwords.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-comanda}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible local object storage (staging/prod use Scaleway).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # One-shot: create the bucket and make it anonymously readable, mirroring the
  # public-read posture of the Scaleway bucket in staging/prod. The until-loop on
  # `mc alias set` (which validates connectivity) waits for MinIO to be ready —
  # the minio server image has no mc/curl for a healthcheck.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-minioadmin} ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}; do echo 'waiting for minio...'; sleep 1; done &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-comanda-assets} &&
      mc anonymous set download local/${STORAGE_BUCKET:-comanda-assets}
      "

  # Mailpit for email testing
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
