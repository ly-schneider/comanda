components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie (also accepted as Bearer token)
    deviceAuth:
      type: http
      scheme: bearer
      description: Device binding token (POS or Station)
    internalAuth:
      type: http
      scheme: bearer
      description: Shared internal API token for cross-tenant web-tier feeds
