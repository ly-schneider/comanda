openapi: 3.0.3
info:
  title: Comanda API
  description: |
    RESTful API for the ordering system supporting all endpoints.

    ## Authentication
    - **Customer/Admin**: Session-based authentication via Better Auth
    - **Devices**: Device binding token authentication (Station, POS)

    ## Permission Model
    Field-level response shaping based on caller permissions.
    Admin-only fields (marked `x-admin-only`) are omitted for non-privileged callers.
  version: 1.0.0

servers:
  - url: /v1
    description: API v1

tags:
  - name: Auth
    description: Authentication (OTP email delivery)
  - name: Products
    description: Product catalog (simple and bundle types)
  - name: Categories
    description: Product categories
  - name: Bundles
    description: Bundle product configuration with slots and options
  - name: Orders
    description: Order management (shop and POS origins)
  - name: Refunds
    description: Per-order refunds (line, arbitrary, cancellation) for POS operators and admins
  - name: Payments
    description: Payment processing (Payrexx gateway, cash, card, TWINT)
  - name: Users
    description: User management (admin)
  - name: Invites
    description: Admin user invitation system
  - name: Stations
    description: Pickup station management and QR redemption
  - name: POS
    description: Point of sale terminal operations
  - name: Devices
    description: Device registration, pairing, and binding management
  - name: Jetons
    description: Jeton (color tag) management for POS fulfillment
  - name: Events
    description: Event/month aggregation for admin dashboard
  - name: System
    description: System status (enabled/disabled)
  - name: Settings
    description: Application settings (POS mode)
  - name: Domains
    description: Per-tenant custom domains (ownership verification, TLS status)
  - name: Platform
    description: Platform admin (cross-tenant tenant provisioning and management)
  - name: Account
    description: Vendor account hub (self-service, scoped to the vendor's tenant)
  - name: OwnerInvites
    description: Owner-invite registration (platform-host invite → tenant owner)
  - name: StaffPerks
    description: Public staff-perk claim access (campaign admin lives under the staff-perks plugin)
  - name: Inventory
    description: Real-time inventory stream and history export
  - name: Android
    description: Android app release feed for update checks
  - name: Internal
    description: Cross-tenant internal feeds (web tier integration)
  - name: Plugins
    description: Per-tenant plugin enablement and configuration

