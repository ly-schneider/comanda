ProductType:
  type: string
  enum: [simple, bundle]
  description: |
    - `simple`: Standalone product
    - `bundle`: Composite product with bundle slots and options

Product:
  type: object
  required: [id, categoryId, type, name, priceCents, depositCents, isActive]
  properties:
    id:
      type: string
    categoryId:
      type: string
    type:
      $ref: "#/ProductType"
    name:
      type: string
      maxLength: 20
    image:
      type: string
      nullable: true
      description: Image URL
    description:
      type: string
      nullable: true
      maxLength: 500
      description: Optional free-text description shown to customers
    priceCents:
      type: integer
      format: int64
      description: Price in cents (CHF)
    depositCents:
      type: integer
      format: int64
      description: Refundable per-unit deposit in cents (CHF); 0 means no deposit
    jetonId:
      type: string
      nullable: true
    isActive:
      type: boolean
    variantLabel:
      type: string
      nullable: true
      maxLength: 20
      description: Heading for the variant picker (e.g. "Grösse")
    variants:
      type: array
      items:
        $ref: "#/ProductVariant"
      description: Selectable variants; only present on simple products that define them
    # Admin-only fields
    createdAt:
      type: string
      format: date-time
      x-admin-only: true
    updatedAt:
      type: string
      format: date-time
      x-admin-only: true
    stock:
      type: integer
      description: Current inventory level (computed from ledger)
      x-admin-only: true
    # Embedded relations (included in list responses)
    category:
      $ref: "categories.yaml#/CategorySummary"
    jeton:
      $ref: "jetons.yaml#/JetonSummary"
      nullable: true
    bundleSlots:
      type: array
      items:
        $ref: "bundles.yaml#/BundleSlotSummary"
      description: Only present for bundle-type products

ProductVariant:
  type: object
  required: [id, value, priceAdjustmentCents, isActive, sequence]
  properties:
    id:
      type: string
    value:
      type: string
      maxLength: 20
      description: Variant value shown to customers (e.g. "M")
    priceAdjustmentCents:
      type: integer
      format: int64
      description: Signed delta on the product's base price in cents (CHF)
    isActive:
      type: boolean
    sequence:
      type: integer
    stock:
      type: integer
      description: Current variant inventory level (computed from ledger)
      x-admin-only: true

VariantUpsert:
  type: object
  required: [value]
  properties:
    id:
      type: string
      description: Present to update an existing variant; omitted to create one
    value:
      type: string
      maxLength: 20
    priceAdjustmentCents:
      type: integer
      format: int64
      default: 0
    isActive:
      type: boolean
      default: true
    sequence:
      type: integer
      default: 0

ProductCreate:
  type: object
  required: [categoryId, name, priceCents]
  properties:
    categoryId:
      type: string
    type:
      $ref: "#/ProductType"
      default: simple
    name:
      type: string
      maxLength: 20
    image:
      type: string
    description:
      type: string
      maxLength: 500
    priceCents:
      type: integer
      format: int64
      minimum: 0
    depositCents:
      type: integer
      format: int64
      minimum: 0
      description: Refundable per-unit deposit in cents (CHF)
    jetonId:
      type: string
    variantLabel:
      type: string
      maxLength: 20
    variants:
      type: array
      items:
        $ref: "#/VariantUpsert"

ProductUpdate:
  type: object
  properties:
    name:
      type: string
      maxLength: 20
    image:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
      maxLength: 500
    priceCents:
      type: integer
      format: int64
      minimum: 0
    depositCents:
      type: integer
      format: int64
      minimum: 0
      description: Refundable per-unit deposit in cents (CHF)
    isActive:
      type: boolean
    categoryId:
      type: string
    jetonId:
      type: string
      nullable: true
    variantLabel:
      type: string
      nullable: true
      maxLength: 20
    variants:
      type: array
      items:
        $ref: "#/VariantUpsert"
      description: |
        Full desired variant set: entries with an id update, entries without
        create, existing variants missing from the list are removed (archived
        when already referenced by orders). Omit the field to leave variants
        unchanged.

ProductImageResponse:
  type: object
  required: [imageUrl]
  properties:
    imageUrl:
      type: string

ProductList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Product"

Inventory:
  type: object
  required: [productId, quantity]
  properties:
    productId:
      type: string
    quantity:
      type: integer
    variants:
      type: array
      items:
        $ref: "#/VariantInventory"
      description: Per-variant stock; only present for products with variants
    updatedAt:
      type: string
      format: date-time

VariantInventory:
  type: object
  required: [variantId, quantity]
  properties:
    variantId:
      type: string
    quantity:
      type: integer

InventoryAdjustment:
  type: object
  required: [delta, reason]
  properties:
    delta:
      type: integer
      description: Positive to add, negative to remove
    reason:
      $ref: "#/InventoryReason"
    variantId:
      type: string
      description: Required for products with variants; forbidden otherwise

InventoryReason:
  type: string
  enum: [opening_balance, sale, refund, manual_adjust, correction]

InventoryLedgerEntry:
  type: object
  required: [id, productId, delta, reason, createdAt]
  properties:
    id:
      type: string
    productId:
      type: string
    delta:
      type: integer
    reason:
      $ref: "#/InventoryReason"
    createdAt:
      type: string
      format: date-time
    orderId:
      type: string
      nullable: true
    orderLineId:
      type: string
      nullable: true
    deviceId:
      type: string
      nullable: true
    createdBy:
      type: string
      nullable: true
    createdByUser:
      $ref: "users.yaml#/UserSummary"
    variantId:
      type: string
      nullable: true

InventoryLedgerList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/InventoryLedgerEntry"
