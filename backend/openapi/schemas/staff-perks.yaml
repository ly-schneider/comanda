VolunteerCampaignProduct:
  type: object
  required: [productId, productName, quantity]
  properties:
    productId:
      type: string
    productName:
      type: string
    productImage:
      type: string
      nullable: true
    quantity:
      type: integer

ClaimAccessVerify:
  type: object
  required: [code]
  properties:
    code:
      type: string
      description: Four-digit access code for the campaign.

ClaimAccessResult:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean

ClaimCampaign:
  type: object
  required: [campaign, products, qrPayload]
  properties:
    campaign:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
    products:
      type: array
      items:
        $ref: "#/VolunteerCampaignProduct"
    qrPayload:
      type: string

CampaignRedemptionResult:
  type: object
  required: [orderId, redemptionCount, maxRedemptions]
  properties:
    orderId:
      type: string
    redemptionCount:
      type: integer
    maxRedemptions:
      type: integer
    station:
      type: object
      description: Station-side redemption result (matched/redeemed items).
      nullable: true
