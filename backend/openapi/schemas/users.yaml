TenantRole:
  type: string
  enum: [owner, admin, app_admin, staff, catalog]
  x-enum-varnames: [TenantRoleOwner, TenantRoleAdmin, TenantRoleAppAdmin, TenantRoleStaff, TenantRoleCatalog]
  description: The member's role within the bound tenant's organization.

User:
  type: object
  required: [id, email, createdAt]
  properties:
    id:
      type: string
      description: Better Auth user ID
    role:
      $ref: "#/TenantRole"
    name:
      type: string
      nullable: true
    email:
      type: string
      format: email
    emailVerified:
      type: boolean
    image:
      type: string
      nullable: true
    isAnonymous:
      type: boolean
    banned:
      type: boolean
    banReason:
      type: string
      nullable: true
    banExpires:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

UserUpdate:
  type: object
  properties:
    name:
      type: string
    role:
      $ref: "#/TenantRole"

UserSummary:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    email:
      type: string
      format: email

UserList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/User"
