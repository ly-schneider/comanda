StationqrPreset:
  type: object
  required: [id, name, disabled, token, enrollUrl, productIds, createdAt, updatedAt]
  properties:
    id:
      type: string
    name:
      type: string
    disabled:
      type: boolean
      description: When true, the preset exists but enrollment through its QR is suspended
    token:
      type: string
      description: Raw enrollment token (ops-tier only)
    enrollUrl:
      type: string
      description: Enrollment URL on the tenant's primary domain, encoded into the printable QR
    productIds:
      type: array
      items:
        type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

StationqrPresetList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/StationqrPreset"

StationqrPresetCreate:
  type: object
  required: [name]
  properties:
    name:
      type: string
      maxLength: 60
    productIds:
      type: array
      items:
        type: string

StationqrPresetUpdate:
  type: object
  properties:
    name:
      type: string
      maxLength: 60
    disabled:
      type: boolean
    productIds:
      type: array
      items:
        type: string

StationqrEnrollRequest:
  type: object
  required: [token, deviceKey]
  properties:
    token:
      type: string
      description: Enrollment token scanned from the printed QR
    deviceKey:
      type: string
      maxLength: 100
    name:
      type: string
      maxLength: 20
    model:
      type: string
      maxLength: 50
    os:
      type: string
      maxLength: 20

StationqrEnrollResponse:
  type: object
  required: [token, device]
  properties:
    token:
      type: string
      description: Device session token (Bearer credential for subsequent requests)
    device:
      $ref: "../devices.yaml#/Device"
