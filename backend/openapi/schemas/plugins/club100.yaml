Club100Person:
  type: object
  required: [id, firstName, lastName, remaining, max]
  properties:
    id:
      type: string
      description: Elvanto person ID
    firstName:
      type: string
    lastName:
      type: string
    remaining:
      type: integer
      description: Remaining free redemptions today
    max:
      type: integer
      description: Maximum free redemptions per day

Club100PersonList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/Club100Person"

Club100Remaining:
  type: object
  required: [elvantoPersonId, remaining, max]
  properties:
    elvantoPersonId:
      type: string
    remaining:
      type: integer
    max:
      type: integer

Club100Settings:
  type: object
  required: [freeProductIds, maxRedemptions]
  properties:
    freeProductIds:
      type: array
      items:
        type: string
      description: Product IDs redeemable for free by 100 Club members
    maxRedemptions:
      type: integer
      description: Maximum free redemptions per member per day

Club100SettingsUpdate:
  type: object
  properties:
    freeProductIds:
      type: array
      items:
        type: string
    maxRedemptions:
      type: integer
      minimum: 0
