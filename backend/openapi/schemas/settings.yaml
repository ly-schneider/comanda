Settings:
  type: object
  required: [id, systemEnabled, posMode, club100MaxRedemptions]
  properties:
    id:
      type: string
      default: default
    systemEnabled:
      type: boolean
      default: true
      description: Whether the food system is active for customers
    posMode:
      $ref: "pos.yaml#/PosFulfillmentMode"
    missingJetons:
      type: integer
      description: Count of active products without jeton (when mode is JETON)
    club100FreeProductIds:
      type: array
      items:
        type: string
      description: Product IDs that 100 Club members can redeem for free
    club100MaxRedemptions:
      type: integer
      default: 2
      description: Maximum free redemptions per 100 Club member
    displayName:
      type: string
      nullable: true
      description: Public brand name; falls back to the tenant name when null
    logoUrl:
      type: string
      nullable: true
    faviconUrl:
      type: string
      nullable: true
    colorPrimary:
      type: string
      description: Hex color "#RRGGBB" or "#RRGGBBAA"
    colorPrimaryForeground:
      type: string
    colorSecondary:
      type: string
      description: Supporting accent color (hex)
    colorBackground:
      type: string
    colorForeground:
      type: string
    fontKey:
      type: string
      description: Curated font key (allow-listed)
    radiusKey:
      type: string
      description: Corner style key (none | rounded | pill)
    contactEmail:
      type: string
      nullable: true
    contactPhone:
      type: string
      nullable: true
    legalName:
      type: string
      nullable: true
    legalAddress:
      type: string
      nullable: true
    currency:
      type: string
      description: ISO 4217 currency code (3 uppercase letters)
    paymentProvider:
      type: string
    updatedAt:
      type: string
      format: date-time

SettingsUpdate:
  type: object
  properties:
    systemEnabled:
      type: boolean
    posMode:
      $ref: "pos.yaml#/PosFulfillmentMode"
    club100FreeProductIds:
      type: array
      items:
        type: string
    club100MaxRedemptions:
      type: integer
      minimum: 0
    displayName:
      type: string
      nullable: true
      description: Send "" or null to clear (UI falls back to tenant name)
    colorPrimary:
      type: string
    colorPrimaryForeground:
      type: string
    colorSecondary:
      type: string
    colorBackground:
      type: string
    colorForeground:
      type: string
    fontKey:
      type: string
    radiusKey:
      type: string
    contactEmail:
      type: string
      nullable: true
    contactPhone:
      type: string
      nullable: true
    legalName:
      type: string
      nullable: true
    legalAddress:
      type: string
      nullable: true
    currency:
      type: string
    paymentProvider:
      type: string

Branding:
  type: object
  required: [displayName, colors, contact, legal, currency, fontKey, radiusKey]
  properties:
    displayName:
      type: string
    logoUrl:
      type: string
      nullable: true
    faviconUrl:
      type: string
      nullable: true
    colors:
      $ref: "#/BrandingColors"
    fontKey:
      type: string
      description: Curated font key (allow-listed)
    radiusKey:
      type: string
      description: Corner style key (none | rounded | pill)
    contact:
      $ref: "#/BrandingContact"
    legal:
      $ref: "#/BrandingLegal"
    currency:
      type: string

BrandingColors:
  type: object
  required: [primary, primaryForeground, secondary, background, foreground]
  properties:
    primary:
      type: string
    primaryForeground:
      type: string
    secondary:
      type: string
    background:
      type: string
    foreground:
      type: string

BrandingContact:
  type: object
  properties:
    email:
      type: string
      nullable: true
    phone:
      type: string
      nullable: true

BrandingLegal:
  type: object
  properties:
    name:
      type: string
      nullable: true
    address:
      type: string
      nullable: true
    text:
      type: string
      nullable: true

LogoUploadResponse:
  type: object
  required: [url]
  properties:
    url:
      type: string
