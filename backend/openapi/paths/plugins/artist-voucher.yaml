vouchers:
  get:
    tags: [Plugins]
    summary: List artist vouchers
    description: Returns the tenant's artist vouchers with a computed status per voucher.
    operationId: artistVoucherList
    security:
      - sessionAuth: []
    responses:
      "200":
        description: Vouchers
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherListResponse"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
  post:
    tags: [Plugins]
    summary: Create an artist voucher
    description: >
      Snapshots the chosen categories and signs a durable display token bound to
      the tenant's key, so a scanned voucher verifies fully offline.
    operationId: artistVoucherCreate
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherCreateRequest"
    responses:
      "201":
        description: Voucher created
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucher"
      "400":
        description: Invalid voucher input
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

voucher:
  parameters:
    - name: voucherId
      in: path
      required: true
      schema:
        type: string
  delete:
    tags: [Plugins]
    summary: Delete an artist voucher
    description: >
      Permanently removes a voucher so old test or finished entries stop
      cluttering the list. Only vouchers past their validity window can be
      deleted; a still-valid one returns 409, because dropping it would un-block
      it at offline stations and its printed copies stay redeemable regardless.
      Revoke it first, then delete once it expires.
    operationId: artistVoucherDelete
    security:
      - sessionAuth: []
    responses:
      "204":
        description: Voucher deleted
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Voucher not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "409":
        description: Voucher is still valid and cannot be deleted
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

print:
  parameters:
    - name: voucherId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Plugins]
    summary: Print artist voucher slips
    description: |
      Streams a printable PDF of `count` identical badge-sized slips for one
      voucher, each carrying the byte-mode QR, so the artist can hand copies to
      the people touring with them.

      The optional `count` query parameter sets how many copies (1–500, default
      5); out-of-range values return `400`.
    operationId: artistVoucherPrint
    security:
      - sessionAuth: []
    parameters:
      - name: count
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 5
    responses:
      "200":
        description: PDF document of voucher slips
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Invalid voucher id or count
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Voucher not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

revoke:
  parameters:
    - name: voucherId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Plugins]
    summary: Revoke an artist voucher
    description: Marks the voucher revoked. Idempotent — revoking an already-revoked voucher is a no-op.
    operationId: artistVoucherRevoke
    security:
      - sessionAuth: []
    responses:
      "200":
        description: Revoked voucher
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucher"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Voucher not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

revocations:
  get:
    tags: [Plugins]
    summary: Poll the voucher revocation feed
    description: >
      Returns the ids of revoked vouchers that have not yet expired, so a station
      can block them offline. Expired vouchers drop out; they are already rejected
      by their validity window.
    operationId: artistVoucherRevocations
    security:
      - deviceAuth: []
    responses:
      "200":
        description: Revocation feed
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherRevocations"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Wrong device type
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

batches:
  get:
    tags: [Plugins]
    summary: List single-use voucher batches
    description: >
      Returns every batch of single-use vouchers with its issue/redeem/outstanding
      counts and the current stock of each entitled product, so the admin can see
      what is still in the field against what is left to hand out.
    operationId: artistVoucherBatchList
    security:
      - sessionAuth: []
    responses:
      "200":
        description: Batches
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherBatchListResponse"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
  post:
    tags: [Plugins]
    summary: Issue a batch of single-use vouchers
    description: >
      Mints `count` independent vouchers that share a label, validity window and
      product snapshot. Each carries its own signed token and redeems exactly
      once. Only simple products without variants can be entitled — the token
      carries no variant id, and only a simple product moves inventory.
    operationId: artistVoucherBatchCreate
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherBatchCreateRequest"
    responses:
      "201":
        description: Batch issued
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherBatch"
      "400":
        description: Invalid batch input
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

batch:
  parameters:
    - name: batchId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Plugins]
    summary: Get a voucher batch
    description: Returns the batch together with every voucher in it and its individual status.
    operationId: artistVoucherBatchGet
    security:
      - sessionAuth: []
    responses:
      "200":
        description: Batch
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherBatchDetail"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Batch not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

batch-print:
  parameters:
    - name: batchId
      in: path
      required: true
      schema:
        type: string
  get:
    tags: [Plugins]
    summary: Print a voucher batch
    description: >
      Streams a printable PDF with one badge-sized slip per voucher, each
      carrying its own byte-mode QR, so every slip handed out redeems exactly once.
    operationId: artistVoucherBatchPrint
    security:
      - sessionAuth: []
    responses:
      "200":
        description: PDF document of voucher slips
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Invalid batch id
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Batch not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

batch-revoke:
  parameters:
    - name: batchId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Plugins]
    summary: Revoke a voucher batch
    description: >
      Revokes every voucher in the batch that has not been redeemed yet; already
      redeemed ones are history and stay untouched. Idempotent.
    operationId: artistVoucherBatchRevoke
    security:
      - sessionAuth: []
    responses:
      "200":
        description: Updated batch
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherBatch"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Insufficient tier
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Batch not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"

redeem:
  parameters:
    - name: voucherId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Plugins]
    summary: Redeem a single-use voucher
    description: |
      Mints the gratis order behind a single-use voucher and stamps it redeemed.
      The order runs through the normal checkout path, so stock moves through
      `inventory_ledger` exactly as it does for a paid order, and settles as
      `GRATIS_PLUGIN` at its full nominal total.

      Idempotent on the voucher id: a retried upload returns the original order
      with `alreadyRedeemed: true` instead of minting a second one.

      A sold-out product returns `409 voucher_product_sold_out` with the product
      names in `details.items` — the voucher itself is fine, the food is gone.
    operationId: artistVoucherRedeem
    security:
      - deviceAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherRedeemRequest"
    responses:
      "200":
        description: Voucher redeemed
        content:
          application/json:
            schema:
              $ref: "../../schemas/plugins/artist-voucher.yaml#/ArtistVoucherRedeemResponse"
      "400":
        description: Invalid voucher id, or the voucher is not single-use
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "403":
        description: Wrong device type
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "404":
        description: Voucher not found
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
      "409":
        description: Voucher revoked, outside its validity window, or its product is sold out
        content:
          application/json:
            schema:
              $ref: "../../schemas/common.yaml#/Error"
