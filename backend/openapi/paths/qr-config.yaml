collection:
  get:
    tags: [Stations]
    summary: Get tenant QR signing config
    description: >
      Returns the tenant's public Ed25519 verification key and the QR payload
      format metadata. No authentication; the tenant is resolved from the request
      host. A station/PWA fetches this once at setup to verify pickup QR tokens
      fully offline. Read-only: the keypair is provisioned at boot and on first
      order, so a 503 means it isn't ready yet.
    operationId: getQRConfig
    responses:
      "200":
        description: QR signing config
        content:
          application/json:
            schema:
              $ref: "../schemas/qr.yaml#/QRConfig"
      "503":
        description: Signing key not provisioned yet
