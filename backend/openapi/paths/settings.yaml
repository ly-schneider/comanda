collection:
  get:
    tags: [Settings]
    summary: Get application settings
    description: Returns all application settings including POS mode.
    operationId: getSettings
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    responses:
      "200":
        description: Settings
        content:
          application/json:
            schema:
              $ref: "../schemas/settings.yaml#/Settings"
            example:
              id: "default"
              posMode: QR_CODE
              updatedAt: "2025-02-07T10:00:00Z"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

  patch:
    tags: [Settings]
    summary: Update application settings
    description: Updates application settings. All fields are optional - only provided fields will be updated.
    operationId: updateSettings
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/settings.yaml#/SettingsUpdate"
          examples:
            qr_mode:
              summary: Switch to QR code mode
              value:
                posMode: QR_CODE
            jeton_mode:
              summary: Switch to jeton mode
              value:
                posMode: JETON
    responses:
      "200":
        description: Settings updated
        content:
          application/json:
            schema:
              $ref: "../schemas/settings.yaml#/Settings"
      "400":
        description: Invalid request (e.g., missing jetons for JETON mode)
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

logo:
  post:
    tags: [Settings]
    summary: Upload branding logo or favicon
    description: >
      Uploads a logo or favicon image to the tenant's asset bucket and stores
      the resulting URL in settings. Accepts PNG, JPEG, WebP, or ICO.
    operationId: uploadBrandingLogo
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              kind:
                type: string
                enum: [logo, favicon]
                default: logo
    responses:
      "200":
        description: Asset uploaded
        content:
          application/json:
            schema:
              $ref: "../schemas/settings.yaml#/LogoUploadResponse"
      "400":
        description: Invalid file
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

  delete:
    tags: [Settings]
    summary: Delete branding logo or favicon
    operationId: deleteBrandingLogo
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum: [logo, favicon]
          default: logo
    responses:
      "204":
        description: Asset deleted
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

payrexx:
  get:
    tags: [Settings]
    summary: Get Payrexx connection status
    description: |
      Returns the staged setup state of the tenant's Payrexx integration, the
      tenant-specific webhook URL to register in the Payrexx dashboard, and the
      time the last inbound webhook was verified. Secrets are never returned.
    operationId: getPayrexxStatus
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    responses:
      "200":
        description: Payrexx status
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [not_started, api_connected, configured]
                instance:
                  type: string
                webhookUrl:
                  type: string
                lastWebhookAt:
                  type: string
                  format: date-time
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

payrexxApi:
  put:
    tags: [Settings]
    summary: Connect Payrexx API credentials
    description: |
      Staged step one. Validates the instance + API key with a live API call,
      then stores them AES-256-GCM-encrypted on the tenant settings row and
      returns the status (including the webhook URL to register in Payrexx).
    operationId: connectPayrexxApi
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [instance, apiSecret]
            properties:
              instance:
                type: string
              apiSecret:
                type: string
    responses:
      "200":
        description: Payrexx API connected
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [not_started, api_connected, configured]
                instance:
                  type: string
                webhookUrl:
                  type: string
                lastWebhookAt:
                  type: string
                  format: date-time
      "400":
        description: Invalid or unverifiable credentials
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

payrexxWebhook:
  put:
    tags: [Settings]
    summary: Set Payrexx webhook secret
    description: |
      Staged step two. Stores the webhook signing secret Payrexx generated when
      the merchant created the webhook, AES-256-GCM-encrypted, completing the
      configuration. Requires the API step to have run first.
    operationId: setPayrexxWebhookSecret
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [webhookSecret]
            properties:
              webhookSecret:
                type: string
    responses:
      "200":
        description: Payrexx webhook secret stored
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [not_started, api_connected, configured]
                instance:
                  type: string
                webhookUrl:
                  type: string
                lastWebhookAt:
                  type: string
                  format: date-time
      "400":
        description: Invalid request or API not yet connected
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

payrexxTest:
  post:
    tags: [Settings]
    summary: Test Payrexx API connection
    description: |
      Re-validates the stored Payrexx instance + API key with a live API call,
      so the merchant can confirm the connection at any time.
    operationId: testPayrexxConnection
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    responses:
      "200":
        description: Connection OK
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok:
                  type: boolean
      "400":
        description: Invalid or unverifiable credentials
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
