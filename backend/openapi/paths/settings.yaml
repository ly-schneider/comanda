collection:
  get:
    tags: [Settings]
    summary: Get application settings
    description: Returns all application settings including POS mode and Club100 configuration.
    operationId: getSettings
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    responses:
      "200":
        description: Settings
        content:
          application/json:
            schema:
              $ref: "../schemas/settings.yaml#/Settings"
            example:
              id: "default"
              posMode: QR_CODE
              club100FreeProductIds: []
              club100MaxRedemptions: 2
              updatedAt: "2025-02-07T10:00:00Z"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

  patch:
    tags: [Settings]
    summary: Update application settings
    description: Updates application settings. All fields are optional - only provided fields will be updated.
    operationId: updateSettings
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/settings.yaml#/SettingsUpdate"
          examples:
            qr_mode:
              summary: Switch to QR code mode
              value:
                posMode: QR_CODE
            jeton_mode:
              summary: Switch to jeton mode
              value:
                posMode: JETON
            club100:
              summary: Update Club100 settings
              value:
                club100FreeProductIds: ["spec______21"]
                club100MaxRedemptions: 3
    responses:
      "200":
        description: Settings updated
        content:
          application/json:
            schema:
              $ref: "../schemas/settings.yaml#/Settings"
      "400":
        description: Invalid request (e.g., missing jetons for JETON mode)
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

logo:
  post:
    tags: [Settings]
    summary: Upload branding logo or favicon
    description: >
      Uploads a logo or favicon image to the tenant's asset bucket and stores
      the resulting URL in settings. Accepts PNG, JPEG, WebP, or ICO.
    operationId: uploadBrandingLogo
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              kind:
                type: string
                enum: [logo, favicon]
                default: logo
    responses:
      "200":
        description: Asset uploaded
        content:
          application/json:
            schema:
              $ref: "../schemas/settings.yaml#/LogoUploadResponse"
      "400":
        description: Invalid file
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

  delete:
    tags: [Settings]
    summary: Delete branding logo or favicon
    operationId: deleteBrandingLogo
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum: [logo, favicon]
          default: logo
    responses:
      "204":
        description: Asset deleted
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

payrexx:
  get:
    tags: [Settings]
    summary: Get Payrexx connection status
    description: |
      Returns whether the tenant's Payrexx integration is configured and the
      tenant-specific webhook URL to register in the Payrexx dashboard. Secrets
      are never returned.
    operationId: getPayrexxStatus
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    responses:
      "200":
        description: Payrexx status
        content:
          application/json:
            schema:
              type: object
              required: [configured]
              properties:
                configured:
                  type: boolean
                instance:
                  type: string
                webhookUrl:
                  type: string
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

  put:
    tags: [Settings]
    summary: Configure Payrexx credentials
    description: |
      Validates the supplied Payrexx credentials with a live API call, then
      stores them AES-256-GCM-encrypted on the tenant settings row. Returns the
      tenant-specific webhook URL.
    operationId: configurePayrexx
    security:
      - sessionAuth: []
    x-required-permissions: [admin:access]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [instance, apiSecret, webhookSecret]
            properties:
              instance:
                type: string
              apiSecret:
                type: string
              webhookSecret:
                type: string
    responses:
      "200":
        description: Payrexx configured
        content:
          application/json:
            schema:
              type: object
              required: [configured, webhookUrl]
              properties:
                configured:
                  type: boolean
                webhookUrl:
                  type: string
      "400":
        description: Invalid or unverifiable credentials
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
