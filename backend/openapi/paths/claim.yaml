item:
  parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string

  get:
    tags: [StaffPerks]
    summary: Get claim campaign
    description: |
      Returns the public claim view for a staff-perk campaign. Requires a valid
      access session cookie established via the auth endpoint.
    operationId: getClaimCampaign
    security:
      - {}
    responses:
      "200":
        description: Claim campaign view
        content:
          application/json:
            schema:
              $ref: "../schemas/staff-perks.yaml#/ClaimCampaign"
      "400":
        description: Invalid token
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Access code required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "404":
        description: Campaign not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

auth:
  parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string

  post:
    tags: [StaffPerks]
    summary: Verify claim access code
    description: |
      Validates a campaign access code and establishes an access session cookie
      used by subsequent claim requests.
    operationId: verifyClaimAccess
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/staff-perks.yaml#/ClaimAccessVerify"
    responses:
      "200":
        description: Access granted
        content:
          application/json:
            schema:
              $ref: "../schemas/staff-perks.yaml#/ClaimAccessResult"
      "400":
        description: Invalid token or request body
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Incorrect access code
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "404":
        description: Campaign not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
