    summary: Set category active state
    description: Toggles a category's active flag from a POS device.
    operationId: setCategoryActive
    security:
      - deviceAuth: []
    x-device-types: [POS]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [isActive]
            properties:
