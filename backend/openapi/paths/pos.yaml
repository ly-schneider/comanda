me:
  get:
    tags: [POS]
    summary: Get current POS
    description: Returns POS device info for the authenticated POS device.
    operationId: getCurrentPos
    security:
      - deviceAuth: []
    x-device-types: [POS]
    responses:
      "200":
        description: POS device details
        content:
          application/json:
            schema:
              $ref: "../schemas/pos.yaml#/POSDevice"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

product-active:
  parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string

  patch:
    tags: [POS]
    summary: Set product active state
    description: Toggles a product's active flag from a POS device.
    operationId: setProductActive
    security:
      - deviceAuth: []
    x-device-types: [POS]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [isActive]
            properties:
              isActive:
                type: boolean
    responses:
      "200":
        description: Product updated
        content:
          application/json:
            schema:
              $ref: "../schemas/products.yaml#/Product"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "404":
        description: Product not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

devices:
  get:
    tags: [POS]
    summary: List POS devices
    operationId: listPosDevices
    security:
      - sessionAuth: []
    x-required-permissions: [pos:manage]
    responses:
      "200":
        description: POS device list
        content:
          application/json:
            schema:
              $ref: "../schemas/pos.yaml#/POSDeviceList"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
