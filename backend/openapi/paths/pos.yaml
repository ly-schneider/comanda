        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"

devices:
  get:
    tags: [POS]
    summary: List POS devices
    operationId: listPosDevices
    security:
      - sessionAuth: []
    x-required-permissions: [pos:manage]
    responses:
      "200":
        description: POS device list
        content:
          application/json:
            schema:
              $ref: "../schemas/pos.yaml#/POSDeviceList"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
