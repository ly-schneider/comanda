order-refunds-arbitrary:
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: string
  post:
    tags: [Refunds]
    summary: Arbitrary (discretionary) refund — admin only
    description: |
      Refunds an arbitrary amount with a required reason, not tied to lines. A
      strictly higher gate than line refunds (app-admin tier); POS operators
      cannot issue these. The amount is capped at the refundable balance.
    operationId: CreateArbitraryRefund
    security:
      - sessionAuth: []
    x-required-permissions: [orders:refund-arbitrary]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/refunds.yaml#/ArbitraryRefundRequest"
    responses:
      "201":
        description: Refund created
        content:
          application/json:
            schema:
              $ref: "../schemas/refunds.yaml#/Refund"
      "400":
        description: Validation error (missing reason, not refundable)
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "403":
        description: Insufficient permissions
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/Error"
      "404":
        description: Resource not found
        content:
