name: CI Backend

on:
  workflow_call:
    inputs:
      race:
        description: "Run the test suites under -race (slow; used by the nightly job)"
        type: boolean
        default: false

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-suffix: lint

      - uses: ./.github/actions/generate-backend

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Lint
        working-directory: backend
        # The k8s client-go + cert-manager deps enlarged the typecheck surface, so
        # 3m trips on a cold lint cache (lint itself reports 0 issues). Give it room.
        run: go tool golangci-lint run --timeout=10m ./...

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-suffix: test

      - uses: ./.github/actions/generate-backend

      - name: Run tests
        working-directory: backend
        run: go test ${{ inputs.race && '-race' || '' }} -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-suffix: integration

      - uses: ./.github/actions/generate-backend

      - name: Install Atlas CLI
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5

      - name: Provision test database (migrations + RLS app role)
        working-directory: backend
        run: |
          PRIV="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          atlas migrate apply --dir "file://db/migrations" --url "$PRIV"
          psql "$PRIV" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE comanda_app LOGIN PASSWORD 'app' NOINHERIT;" \
            -c "GRANT USAGE ON SCHEMA public TO comanda_app;" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO comanda_app;" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO comanda_app;"

      - name: Run integration tests
        working-directory: backend
        env:
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          POSTGRES_TEST_DSN_APP: postgres://comanda_app:app@localhost:5432/postgres?sslmode=disable
        run: go test ${{ inputs.race && '-race' || '' }} -count=1 -timeout=10m ./test/integration/...

  migrate-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Atlas CLI
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5

      - name: Validate migration integrity
        working-directory: backend
        run: atlas migrate validate --dir "file://db/migrations"

      # Scaleway prod maxes at PG17 — PG18-only SQL must fail here, not at deploy.
      - name: Replay migrations on PostgreSQL 17
        working-directory: backend
        run: atlas migrate apply --dir "file://db/migrations" --url "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

      - name: Lint new migrations with squawk
        run: |
          git fetch origin main --depth=1
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A origin/main -- backend/db/migrations/ | grep '\.sql$' || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migration files to lint"
            exit 0
          fi
          npm install -g squawk-cli
          echo "$NEW_MIGRATIONS" | xargs squawk
