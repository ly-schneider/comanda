name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            backend:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
            docs:
              - 'docs/**'

  ci-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml

  docs-quality:
    name: Docs Quality Checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: docs

      - name: Lint
        working-directory: docs
        run: pnpm run lint

      - name: Build
        working-directory: docs
        run: pnpm run build

  ci-gate:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - ci-web
      - ci-backend
      - docs-quality
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.ci-web.result }}" == "failure" ]] || \
             [[ "${{ needs.ci-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-quality.result }}" == "failure" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi

          echo "All required jobs passed or were skipped"

  build-and-dispatch:
    name: Build & Dispatch
    needs:
      - ci-gate
      - detect-changes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.ci-gate.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-and-dispatch.yml
    with:
      needs-migrate: ${{ needs.detect-changes.outputs.backend == 'true' }}
    secrets: inherit
