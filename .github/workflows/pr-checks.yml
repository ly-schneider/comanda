name: PR checks

# Runs only the checks for the parts of the repo that changed. main.yml calls this
# workflow too, so pull requests and main run exactly the same checks.
on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      web:
        value: ${{ jobs.changes.outputs.web }}
      backend:
        value: ${{ jobs.changes.outputs.backend }}
      migrations:
        value: ${{ jobs.changes.outputs.migrations }}
      docs:
        value: ${{ jobs.changes.outputs.docs }}

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      docs: ${{ steps.filter.outputs.docs }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/actions/setup-node-pnpm/**'
              - '.github/workflows/pr-checks.yml'
            backend:
              - 'backend/**'
              - '.github/actions/setup-go-env/**'
              - '.github/actions/generate-backend/**'
              - '.github/workflows/pr-checks.yml'
            migrations:
              - 'backend/db/migrations/**'
              - 'backend/Dockerfile.migrate'
            docs:
              - 'docs/**'
              - '.github/workflows/pr-checks.yml'
            android:
              - 'android/**'
              - '.github/workflows/pr-checks.yml'

  web-checks:
    name: Web (format, lint, types, tests)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Format
        working-directory: web
        run: pnpm run prettier
      - name: Lint
        working-directory: web
        run: pnpm run lint
      - name: Types
        working-directory: web
        run: pnpm run typecheck
      - name: Unit tests
        working-directory: web
        run: pnpm test

  web-e2e:
    name: Web (build and e2e)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: ci-build-stub-not-used-at-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install Playwright with system packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium
      - name: Production build
        working-directory: web
        run: pnpm run build
      - name: End-to-end tests
        working-directory: web
        run: pnpm run e2e:headless

  backend-lint:
    name: Backend (lint)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-env
        with:
          cache-suffix: lint
      - uses: ./.github/actions/generate-backend
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      - name: Lint
        working-directory: backend
        # The Kubernetes client dependencies make a cold typecheck take longer than 3 minutes.
        run: go tool golangci-lint run --timeout=10m ./...

  backend-test:
    name: Backend (unit tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-env
        with:
          cache-suffix: test
      - uses: ./.github/actions/generate-backend
      - name: Unit tests
        working-directory: backend
        run: go test ./...

  backend-integration:
    name: Backend (integration tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # 17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      POSTGRES_TEST_DSN_APP: postgres://comanda_app:app@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-env
        with:
          cache-suffix: integration
      - uses: ./.github/actions/generate-backend
      - uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5
      - name: Migrate and create the row-level security app role
        working-directory: backend
        run: |
          atlas migrate apply --dir "file://db/migrations" --url "$POSTGRES_TEST_DSN"
          psql "$POSTGRES_TEST_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE comanda_app LOGIN PASSWORD 'app' NOINHERIT;" \
            -c "GRANT USAGE ON SCHEMA public TO comanda_app;" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO comanda_app;" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO comanda_app;"
      - name: Integration tests
        working-directory: backend
        run: go test -count=1 -timeout=10m ./test/integration/...

  backend-migrations:
    name: Backend (migrations)
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # 17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0.5
      - name: Check migration checksums
        working-directory: backend
        run: atlas migrate validate --dir "file://db/migrations"
      # Production runs PostgreSQL 17 on Scaleway, so SQL that needs a newer version must fail here.
      - name: Apply all migrations on PostgreSQL 17
        working-directory: backend
        run: atlas migrate apply --dir "file://db/migrations" --url "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      - name: Lint new migrations with squawk
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          NEW=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- backend/db/migrations/ | grep '\.sql$' || true)
          if [ -z "$NEW" ]; then
            echo "No new migrations"
            exit 0
          fi
          echo "$NEW" | xargs npx --yes squawk-cli@2.72.0

  docs:
    name: Docs (lint and build)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: docs
      - name: Lint
        working-directory: docs
        run: pnpm run lint
      - name: Build
        working-directory: docs
        run: pnpm run build

  android:
    name: Android (lint, tests, debug build)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint
        working-directory: android
        run: ./gradlew lint --parallel
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --parallel
      # `test` from android/ only reaches :app; buildSrc has its own tests.
      - name: buildSrc tests
        working-directory: android
        run: ./gradlew -p buildSrc test
      - name: Debug build
        working-directory: android
        run: ./gradlew assembleDebug --parallel

  all-checks:
    name: All checks
    needs: [changes, web-checks, web-e2e, backend-lint, backend-test, backend-integration, backend-migrations, docs, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
