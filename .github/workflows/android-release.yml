name: Android Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build for"
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version, e.g. 1.2.3. Leave empty to use the next patch version after the last release for this environment."
        required: false
        default: ""
        type: string
      tenants:
        description: >
          Tenant builds to produce, as JSON:
          [{"pkg":"t_acme","label":"Acme","posUrl":"https://acme.comanda.leys.ch/pos","iconBg":"#0B5D3B","iconUrl":"https://…/logo.png"}].
          Leave empty for the neutral build only. iconUrl is optional; without a
          usable logo the badge shows the tenant's initials. iconBg colours the
          badge behind initials or transparent art, and is ignored when the logo
          carries its own opaque matte.
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  version:
    name: Pick version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Use the given version or suggest the next one
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prefix="android-$ENVIRONMENT-v"
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$prefix" --jq '.[].ref' \
            | sed "s|refs/tags/$prefix||" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<<"$last"
            suggested="$major.$minor.$((patch + 1))"
          else
            suggested="1.0.0"
          fi
          version="${REQUESTED:-$suggested}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$prefix$version" >/dev/null 2>&1; then
            echo "::error::$prefix$version already exists. The next free version is $suggested."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Android $ENVIRONMENT $version"
            echo ""
            echo "- Last release: ${last:-none}"
            echo "- Suggested next version: $suggested"
            echo "- Building: $version"
          } >> "$GITHUB_STEP_SUMMARY"

  quality-checks:
    name: Android Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Lint
        working-directory: android
        run: ./gradlew lint --parallel

      - name: Run tests
        working-directory: android
        run: ./gradlew test --parallel

      # Gradle 8+ builds buildSrc's jar without running its tests, and `test`
      # from android/ only reaches :app.
      - name: Run buildSrc tests
        working-directory: android
        run: ./gradlew -p buildSrc test

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --parallel

  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    needs: [version, quality-checks]
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Build the matrix
        id: plan
        env:
          TENANTS: ${{ inputs.tenants }}
        run: |
          set -euo pipefail
          # The neutral build always ships. Optional keys are filled with "" so
          # nothing reaches the matrix as null, where GitHub's null-vs-"" coercion
          # would decide behaviour.
          EMPTY='{pkg:"",label:"",posUrl:"",iconBg:"",iconUrl:""}'
          BUILDS=$(jq -c --argjson empty "$(jq -nc "$EMPTY")" \
            '[$empty] + [(. // [])[] | $empty + with_entries(select(.value != null))]' \
            <<<"${TENANTS:-[]}")

          if ! jq -e 'all(.[]; .pkg == "" or (.pkg | test("^t_[a-z0-9_]{1,60}$")))' <<<"$BUILDS" >/dev/null; then
            echo "A tenant pkg is not a valid android_package_id (^t_[a-z0-9_]{1,60}$)"; exit 1
          fi
          if ! jq -e 'all(.[]; .pkg == "" or (.label != "" and .posUrl != ""))' <<<"$BUILDS" >/dev/null; then
            echo "Every tenant build needs a label and a posUrl"; exit 1
          fi
          # Exactly one neutral leg: an entry whose pkg key is missing or misspelled
          # would otherwise normalise to "" and quietly build a second neutral APK,
          # colliding on both the asset name and the artifact name.
          if [ "$(jq '[.[] | select(.pkg == "")] | length' <<<"$BUILDS")" -ne 1 ]; then
            echo "A tenant entry is missing its pkg"; exit 1
          fi
          if ! jq -e '(map(.pkg) | unique | length) == length' <<<"$BUILDS" >/dev/null; then
            echo "Duplicate pkg across tenant entries"; exit 1
          fi
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  - " + (if .pkg == "" then "neutral" else .pkg + " (" + .label + ")" end)' <<<"$BUILDS"

  build:
    name: Build ${{ matrix.build.pkg == '' && 'neutral' || matrix.build.pkg }}
    runs-on: ubuntu-latest
    needs: [version, plan]
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.plan.outputs.builds) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/comanda-upload.jks"
          echo "COMANDA_UPLOAD_STORE_FILE=$RUNNER_TEMP/comanda-upload.jks" >> "$GITHUB_ENV"

      - name: Fetch tenant logo
        id: icon
        if: matrix.build.iconUrl != ''
        env:
          ICON_URL: ${{ matrix.build.iconUrl }}
        run: |
          set -euo pipefail
          # Not fatal: the generator falls back to initials.
          if curl -fsSL --max-time 30 "$ICON_URL" -o "$RUNNER_TEMP/tenant-icon"; then
            echo "path=$RUNNER_TEMP/tenant-icon" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not fetch $ICON_URL; falling back to initials"
          fi

      - name: Derive download token
        id: token
        env:
          DOWNLOAD_SECRET: ${{ secrets.ANDROID_DOWNLOAD_SECRET }}
          CHANNEL: ${{ inputs.environment == 'staging' && 'staging' || 'production' }}
          PKG: ${{ matrix.build.pkg }}
        run: |
          set -euo pipefail
          if [ -z "${DOWNLOAD_SECRET:-}" ]; then
            echo "::notice::ANDROID_DOWNLOAD_SECRET unset; building without a download token"
            exit 0
          fi
          # Must match androidUpdateService.DownloadToken exactly — a mismatch
          # locks tablets out of updates. Pinned by TestDownloadTokenGoldenVector.
          TOKEN=$(printf '%s|%s' "$CHANNEL" "$PKG" \
            | openssl dgst -sha256 -hmac "$DOWNLOAD_SECRET" -binary \
            | base64 | tr '+/' '-_' | tr -d '=' | cut -c1-32)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          VERSION_TAG: ${{ needs.version.outputs.version }}
          SUMUP_AFFILIATE_KEY: ${{ secrets.SUMUP_AFFILIATE_KEY }}
          ORG_GRADLE_PROJECT_sumupAffiliateKey: ${{ secrets.SUMUP_AFFILIATE_KEY }}
          ORG_GRADLE_PROJECT_posUrl: ${{ matrix.build.posUrl != '' && matrix.build.posUrl || secrets.POS_URL }}
          ORG_GRADLE_PROJECT_comandaEnv: ${{ inputs.environment }}
          ORG_GRADLE_PROJECT_tenantPkg: ${{ matrix.build.pkg }}
          ORG_GRADLE_PROJECT_appLabel: ${{ matrix.build.label }}
          ORG_GRADLE_PROJECT_iconBg: ${{ matrix.build.iconBg }}
          ORG_GRADLE_PROJECT_iconSource: ${{ steps.icon.outputs.path }}
          ORG_GRADLE_PROJECT_updateToken: ${{ steps.token.outputs.value }}
          COMANDA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COMANDA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COMANDA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          UPDATE_CHECK_URL: ${{ vars.UPDATE_CHECK_URL }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" == "staging" ]; then
            ./gradlew clean assembleStaging
          else
            ./gradlew clean assembleRelease
          fi

      - name: Name the APK for its package
        id: artifact
        env:
          PKG: ${{ matrix.build.pkg }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" == "staging" ]; then
            APK_DIR="android/app/build/outputs/apk/staging"
          else
            APK_DIR="android/app/build/outputs/apk/release"
          fi

          # The backend matches this name exactly, so a device only gets its own build.
          if [ -z "$PKG" ]; then
            NAME="comanda-pos.apk"
          else
            NAME="comanda-pos-$PKG.apk"
          fi

          cd "$APK_DIR"
          apks=(./*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#apks[@]}"; ls -la; exit 1
          fi
          mv "${apks[0]}" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

          {
            echo "dir=$APK_DIR"
            echo "name=$NAME"
            echo "artifact=${PKG:-neutral}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ steps.artifact.outputs.artifact }}
          path: |
            ${{ steps.artifact.outputs.dir }}/${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.dir }}/${{ steps.artifact.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 7


  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write

    steps:
      - name: Download all APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: android-${{ inputs.environment }}-v${{ needs.version.outputs.version }}
          name: Android POS ${{ inputs.environment }} v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.environment == 'staging' }}
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
          body: |
            Android POS for ${{ inputs.environment }}, version ${{ needs.version.outputs.version }}, built from ${{ github.ref_name }} at ${{ github.sha }}.

            There is one APK per organiser package plus the neutral build. Tablets download their own APK through the update feed. People install it from the QR code in platform admin.
