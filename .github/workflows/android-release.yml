name: Android Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build for"
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      tenants:
        description: >
          Tenant builds to produce, as JSON:
          [{"pkg":"t_acme","label":"Acme","posUrl":"https://acme.comanda.leys.ch/pos","iconBg":"#0B5D3B","iconUrl":"https://…/logo.png"}].
          Leave empty for the neutral build only. iconBg and iconUrl are
          optional — without a usable logo the icon falls back to the tenant's
          initials.
        required: false
        default: "[]"
        type: string

jobs:
  quality-checks:
    name: Android Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Lint
        working-directory: android
        run: ./gradlew lint --parallel

      - name: Run tests
        working-directory: android
        run: ./gradlew test --parallel

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --parallel

  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    needs: quality-checks
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Build the matrix
        id: plan
        env:
          TENANTS: ${{ inputs.tenants }}
        run: |
          set -euo pipefail
          # The neutral build always ships: it is the demo/bring-up app and the
          # fallback if a tenant build ever has to be rolled back.
          #
          # Every entry is filled out with empty strings for the optional keys.
          # A missing key would reach the matrix as null, and null vs "" in a
          # GitHub expression is a coercion rule nobody should have to remember.
          EMPTY='{pkg:"",label:"",posUrl:"",iconBg:"",iconUrl:""}'
          BUILDS=$(jq -c --argjson empty "$(jq -nc "$EMPTY")" \
            '[$empty] + [(. // [])[] | $empty + with_entries(select(.value != null))]' \
            <<<"${TENANTS:-[]}")

          if ! jq -e 'all(.[]; .pkg == "" or (.pkg | test("^t_[a-z0-9_]{1,60}$")))' <<<"$BUILDS" >/dev/null; then
            echo "A tenant pkg is not a valid android_package_id (^t_[a-z0-9_]{1,60}$)"; exit 1
          fi
          if ! jq -e 'all(.[]; .pkg == "" or (.label != "" and .posUrl != ""))' <<<"$BUILDS" >/dev/null; then
            echo "Every tenant build needs a label and a posUrl"; exit 1
          fi
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  - " + (if .pkg == "" then "neutral" else .pkg + " (" + .label + ")" end)' <<<"$BUILDS"

  build:
    name: Build ${{ matrix.build.pkg == '' && 'neutral' || matrix.build.pkg }}
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.plan.outputs.builds) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/comanda-upload.jks"
          echo "COMANDA_UPLOAD_STORE_FILE=$RUNNER_TEMP/comanda-upload.jks" >> "$GITHUB_ENV"

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi

      - name: Fetch tenant logo
        id: icon
        if: matrix.build.iconUrl != ''
        env:
          ICON_URL: ${{ matrix.build.iconUrl }}
        run: |
          set -euo pipefail
          # A missing or unreadable logo is not fatal — the icon generator falls
          # back to the tenant's initials, which is often the better icon anyway.
          if curl -fsSL --max-time 30 "$ICON_URL" -o "$RUNNER_TEMP/tenant-icon"; then
            echo "path=$RUNNER_TEMP/tenant-icon" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not fetch $ICON_URL; falling back to initials"
          fi

      - name: Derive download token
        id: token
        env:
          DOWNLOAD_SECRET: ${{ secrets.ANDROID_DOWNLOAD_SECRET }}
          CHANNEL: ${{ inputs.environment == 'staging' && 'staging' || 'production' }}
          PKG: ${{ matrix.build.pkg }}
        run: |
          set -euo pipefail
          if [ -z "${DOWNLOAD_SECRET:-}" ]; then
            echo "::notice::ANDROID_DOWNLOAD_SECRET unset; building without a download token"
            exit 0
          fi
          # Must match androidUpdateService.DownloadToken exactly — a mismatch
          # locks tablets out of updates. The Go side pins this with a golden
          # vector in TestDownloadTokenGoldenVector.
          TOKEN=$(printf '%s|%s' "$CHANNEL" "$PKG" \
            | openssl dgst -sha256 -hmac "$DOWNLOAD_SECRET" -binary \
            | base64 | tr '+/' '-_' | tr -d '=' | cut -c1-32)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          VERSION_TAG: ${{ inputs.version }}
          SUMUP_AFFILIATE_KEY: ${{ secrets.SUMUP_AFFILIATE_KEY }}
          ORG_GRADLE_PROJECT_sumupAffiliateKey: ${{ secrets.SUMUP_AFFILIATE_KEY }}
          ORG_GRADLE_PROJECT_posUrl: ${{ matrix.build.posUrl != '' && matrix.build.posUrl || secrets.POS_URL }}
          ORG_GRADLE_PROJECT_comandaEnv: ${{ inputs.environment }}
          ORG_GRADLE_PROJECT_tenantPkg: ${{ matrix.build.pkg }}
          ORG_GRADLE_PROJECT_appLabel: ${{ matrix.build.label }}
          ORG_GRADLE_PROJECT_iconBg: ${{ matrix.build.iconBg }}
          ORG_GRADLE_PROJECT_iconSource: ${{ steps.icon.outputs.path }}
          ORG_GRADLE_PROJECT_updateToken: ${{ steps.token.outputs.value }}
          COMANDA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COMANDA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COMANDA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          UPDATE_CHECK_URL: ${{ vars.UPDATE_CHECK_URL }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" == "staging" ]; then
            ./gradlew clean assembleStaging
          else
            ./gradlew clean assembleRelease
          fi

      - name: Name the APK for its package
        id: artifact
        env:
          PKG: ${{ matrix.build.pkg }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" == "staging" ]; then
            APK_DIR="android/app/build/outputs/apk/staging"
          else
            APK_DIR="android/app/build/outputs/apk/release"
          fi

          # The asset name is the contract with the update feed: the backend
          # matches it exactly, so a device only ever gets its own build.
          if [ -z "$PKG" ]; then
            NAME="comanda-pos.apk"
          else
            NAME="comanda-pos-$PKG.apk"
          fi

          cd "$APK_DIR"
          COUNT=$(ls -1 *.apk | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one APK, found $COUNT"; ls -la; exit 1
          fi
          mv *.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

          echo "dir=$APK_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact=${PKG:-neutral}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-${{ steps.artifact.outputs.artifact }}
          path: |
            ${{ steps.artifact.outputs.dir }}/${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.dir }}/${{ steps.artifact.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        env:
          PKG: ${{ matrix.build.pkg }}
          LABEL: ${{ matrix.build.label }}
          ICON: ${{ steps.icon.outputs.path }}
          BG: ${{ matrix.build.iconBg }}
        run: |
          {
            echo "### ${PKG:-neutral}"
            echo ""
            echo "- **APK:** ${{ steps.artifact.outputs.name }}"
            echo "- **Label:** ${LABEL:-Comanda POS}"
            echo "- **applicationId:** ch.leys.comanda${PKG:+.$PKG}"
            echo "- **POS URL:** ${{ matrix.build.posUrl != '' && matrix.build.posUrl || '(default)' }}"
            echo "- **Icon:** ${ICON:+logo}${ICON:-initials} on ${BG:-#1F1F1D}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-${{ inputs.environment }}-v${{ inputs.version }}
          TITLE: Android POS - ${{ inputs.environment }} v${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IS_PRERELEASE: ${{ inputs.environment == 'staging' }}
        run: |
          set -euo pipefail

          ASSETS=$(ls -1 dist/*.apk dist/*.sha256)
          NOTES=$(cat <<EOF
          ## Android POS Release

          **Environment:** $ENVIRONMENT
          **Version:** $VERSION
          **Branch:** $BRANCH
          **Commit:** $COMMIT_SHA

          ---

          One APK per tenant package plus the neutral build. Tablets fetch their
          own asset through the update feed; humans install from the QR code in
          platform admin.
          EOF
          )

          # Draft first so assets can be attached on immutable-release repos.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$COMMIT_SHA" \
            --draft \
            $ASSETS

          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          fi

      - name: Release summary
        run: |
          {
            echo "## Android Release Created"
            echo ""
            echo "- **Environment:** ${{ inputs.environment }}"
            echo "- **Version:** ${{ inputs.version }}"
            echo "- **Tag:** android-${{ inputs.environment }}-v${{ inputs.version }}"
            echo ""
            echo "### Assets"
            ls -1 dist/*.apk | sed 's|dist/|- |'
          } >> "$GITHUB_STEP_SUMMARY"
