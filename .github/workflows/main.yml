name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/ly-schneider/comanda

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read
      pull-requests: read

  changes:
    name: Pick images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ github.event_name == 'workflow_dispatch' && '["api","migrate","web","docs"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
            migrate:
              - 'backend/db/migrations/**'
              - 'backend/Dockerfile.migrate'
            web:
              - 'web/**'
            docs:
              - 'docs/**'

  build:
    name: Build ${{ matrix.image }}
    needs: [checks, changes]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.image == 'api' && 'backend' || matrix.image == 'migrate' && '.' || matrix.image }}
          file: ${{ matrix.image == 'migrate' && 'backend/Dockerfile.migrate' || format('{0}/Dockerfile', matrix.image == 'api' && 'backend' || matrix.image) }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
          provenance: false
      - name: Keep the digest for the deploy jobs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > digest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest
          retention-days: 7

  deploy-staging:
    name: Staging ${{ matrix.image }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
      url: https://staging.comanda.leys.ch
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
      - id: digest
        run: echo "value=$(cat digest)" >> "$GITHUB_OUTPUT"
      # bump-image in the gitops repo pins the digest in the staging values, and Argo CD rolls it out.
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HETZNER_DISPATCH_PAT }}
          repository: ly-schneider/hetzner
          event-type: bump-image
          client-payload: >-
            {"service": "${{ matrix.image }}", "env": "staging", "tenant": "comanda",
            "image": "${{ env.IMAGE_PREFIX }}-${{ matrix.image }}",
            "digest": "${{ steps.digest.outputs.value }}", "tag": "sha-${{ github.sha }}"}

  production-approval:
    name: Production approval
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://comanda.leys.ch
    permissions:
      actions: read
    steps:
      # Without a required-reviewers rule this job wouldn't wait, so the deploy below would be unapproved.
      - name: Make sure production needs an approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '.protection_rules[]?.type' | grep -qx required_reviewers \
            || { echo "::error::Add a required reviewer in Settings > Environments > production."; exit 1; }

  deploy-production:
    name: Production ${{ matrix.image }}
    needs: [changes, production-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
      - id: digest
        run: echo "value=$(cat digest)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HETZNER_DISPATCH_PAT }}
          repository: ly-schneider/hetzner
          event-type: bump-image
          client-payload: >-
            {"service": "${{ matrix.image }}", "env": "prod", "tenant": "comanda",
            "image": "${{ env.IMAGE_PREFIX }}-${{ matrix.image }}",
            "digest": "${{ steps.digest.outputs.value }}", "tag": "sha-${{ github.sha }}"}
