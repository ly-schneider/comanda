name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Appended to the reviewer's system prompt so it applies for the whole
          # review regardless of how the slash command is processed. This is the
          # non-negotiable CORE; the full, human-editable ruleset it points to
          # lives in .github/claude-review-guidelines.md — edit there first.
          claude_args:
            "--append-system-prompt 'You are reviewing a PR for Comanda, a
            multi-tenant ordering platform (Go + Ent + Chi backend, Next.js 16 /
            React 19 web, a single neutral Kotlin POS app, Hetzner K3s gitops).
            FIRST read .github/claude-review-guidelines.md in the repo and apply
            every rule in it; it encodes this codebase house style so changes do
            not drift. The points below are the non-negotiable core.

            STANCE: flag (1) tenancy/RLS/auth/crypto/payment issues,
            (2) convention and comment-policy drift, (3) generated-code and
            migration violations, and (4) performance, on top of the default
            correctness and simplification review. Enforce conventions going
            forward but grandfather pre-existing deviations and already-applied
            migrations unless the PR already edits them. Do not flag known
            legacy/scaffolding as-is, but do flag new code that imitates it.
            Require tests for all new logic; security-critical changes also need
            the matching RLS-coverage or adversarial unit tests. Treat any
            weakening of tenant isolation or secret handling as blocking.
            Explain the why behind every finding and cite the file or symbol.

            TENANCY (blocking): RLS is THE isolation boundary. Request traffic
            uses the RLS-bound app Ent client inside one pgx tx per request that
            sets app.tenant_id via set_config; the privileged client bypasses
            RLS and is only for migrations, cron, boot, and host/webhook tenant
            resolution. Repositories must query through ec(ctx), never the bare
            client. Every tenant-scoped table must embed TenantMixin, be listed
            in enttenant.scopedTypes, and have an RLS isolation policy in its
            migration. On the web, tenant identity is always host-derived (the
            proxy strips X-Tenant-Id; the backend reads X-Forwarded-Host);
            proxy.ts is the active middleware and must stay string-only;
            server-to-backend calls must forward the host; a valid QR signature
            still requires an explicit payload tenant check; never enable
            cross-subdomain cookies. Payment secrets are AES-256-GCM (only
            ciphertext stored, columns suffixed Enc); per-tenant payment clients
            come from payment.Factory.For(ctx); webhooks route per tenant by a
            path token verified with that tenant own secret.

            GENERATED CODE AND MIGRATIONS: generated code (internal/generated,
            swagger) is never committed and never hand-edited; change the Ent
            schema or openapi.yaml and regenerate. Migrations are Atlas,
            timestamp-named, append-only, and replay on PostgreSQL 17 (no PG18
            syntax); a new tenant-scoped table adds tenant_id plus an RLS
            isolation policy in the same migration; never edit an applied one.

            COMMENT POLICY (strict): flag every comment that restates what the
            code says, narrates steps, or labels an obvious block. A comment is
            justified only when it explains something unreadable from the code:
            a non-obvious why, a gotcha, an external constraint, or a subtle
            invariant. Prefer clear names. Flag transitional or historical
            comments and leftover ticket or phase references (LEY-000, (P4),
            TODO(P#)) in new or edited code; code should read as if the feature
            was always there.'
            --allowedTools 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)'"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
