name: CI Web

on:
  workflow_call:

jobs:
  quality:
    name: Web Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Format check
        working-directory: web
        run: pnpm run prettier

      - name: Lint
        working-directory: web
        run: pnpm run lint

      - name: Type check
        working-directory: web
        run: pnpm run typecheck

  test:
    name: Web Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        working-directory: web
        run: pnpm test -- --shard=${{ matrix.shard }}/1

  build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      # Exercises the Turbopack production build (static export analysis) so
      # dep incompatibilities can't slip through to the Docker image build.
      - name: Build
        working-directory: web
        env:
          BETTER_AUTH_SECRET: ci-build-stub-not-used-at-runtime
        run: pnpm run build

  e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        working-directory: web
        env:
          BETTER_AUTH_SECRET: ci-build-stub-not-used-at-runtime
        run: pnpm run build

      - name: Run e2e
        working-directory: web
        env:
          BETTER_AUTH_SECRET: ci-build-stub-not-used-at-runtime
        run: pnpm run e2e:headless
