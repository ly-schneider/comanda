name: CI Web

on:
  workflow_call:

jobs:
  quality:
    name: Web Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm

      - name: Format check
        working-directory: web
        run: pnpm run prettier

      - name: Lint
        working-directory: web
        run: pnpm run lint

      - name: Type check
        working-directory: web
        run: pnpm run typecheck

  test:
    name: Web Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        working-directory: web
        run: pnpm test -- --shard=${{ matrix.shard }}/1

  build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-node-pnpm

      # Exercises the Turbopack production build (static export analysis) so
      # dep incompatibilities can't slip through to the Docker image build.
      - name: Build
        working-directory: web
        env:
          BETTER_AUTH_SECRET: ci-build-stub-not-used-at-runtime
        run: pnpm run build
