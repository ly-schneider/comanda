name: Build & Dispatch (staging)

# Hetzner staging delivery. Builds api/web/docs/migrate for linux/amd64,
# pushes to GHCR, then fires a repository_dispatch at ly-schneider/hetzner.
# Dispatch contract (consumed there by bump-image.yml):
#   event_type: bump-image
#   client_payload: { service, env, digest, tag, image, tenant }
#
# Security: GITHUB_SHA and GITHUB_OUTPUT are controlled by the runner, not
# untrusted input. DISPATCH_TOKEN / DIGEST / TAG are all set via env: (safe).
# No github.event.* user-controlled values flow into run: steps.
on:
  workflow_call:
    inputs:
      needs-migrate:
        description: "Build comanda-migrate (true when backend/db/migrations/** changed)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      needs-migrate:
        description: "Also build & dispatch the migrate image"
        type: boolean
        default: false

concurrency:
  group: build-dispatch-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ly-schneider/comanda
  DISPATCH_REPO: ly-schneider/hetzner
  DEPLOY_ENV: staging
  TENANT: comanda

jobs:
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - id: meta
        run: |
          echo "image=${IMAGE_PREFIX}-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: false

      - name: Dispatch to hetzner
        env:
          DISPATCH_TOKEN: ${{ secrets.HETZNER_DISPATCH_PAT }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg service "api" \
            --arg env "$DEPLOY_ENV" \
            --arg digest "$DIGEST" \
            --arg tag "$TAG" \
            --arg image "$IMAGE" \
            --arg tenant "$TENANT" \
            '{event_type:"bump-image",client_payload:{service:$service,env:$env,digest:$digest,tag:$tag,image:$image,tenant:$tenant}}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
            -d "$PAYLOAD"

  build-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - id: meta
        run: |
          echo "image=${IMAGE_PREFIX}-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: false

      - name: Dispatch to hetzner
        env:
          DISPATCH_TOKEN: ${{ secrets.HETZNER_DISPATCH_PAT }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg service "web" \
            --arg env "$DEPLOY_ENV" \
            --arg digest "$DIGEST" \
            --arg tag "$TAG" \
            --arg image "$IMAGE" \
            --arg tenant "$TENANT" \
            '{event_type:"bump-image",client_payload:{service:$service,env:$env,digest:$digest,tag:$tag,image:$image,tenant:$tenant}}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
            -d "$PAYLOAD"

  build-docs:
    name: Build & Push Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - id: meta
        run: |
          echo "image=${IMAGE_PREFIX}-docs" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push docs image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: docs
          file: docs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-docs:sha-${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max
          provenance: false

      - name: Dispatch to hetzner
        env:
          DISPATCH_TOKEN: ${{ secrets.HETZNER_DISPATCH_PAT }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg service "docs" \
            --arg env "$DEPLOY_ENV" \
            --arg digest "$DIGEST" \
            --arg tag "$TAG" \
            --arg image "$IMAGE" \
            --arg tenant "$TENANT" \
            '{event_type:"bump-image",client_payload:{service:$service,env:$env,digest:$digest,tag:$tag,image:$image,tenant:$tenant}}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
            -d "$PAYLOAD"

  build-migrate:
    name: Build & Push Migrate
    if: ${{ inputs.needs-migrate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - id: meta
        run: |
          echo "image=${IMAGE_PREFIX}-migrate" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push migrate image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: backend/Dockerfile.migrate
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-migrate:sha-${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
          provenance: false

      - name: Dispatch to hetzner
        env:
          DISPATCH_TOKEN: ${{ secrets.HETZNER_DISPATCH_PAT }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg service "migrate" \
            --arg env "$DEPLOY_ENV" \
            --arg digest "$DIGEST" \
            --arg tag "$TAG" \
            --arg image "$IMAGE" \
            --arg tenant "$TENANT" \
            '{event_type:"bump-image",client_payload:{service:$service,env:$env,digest:$digest,tag:$tag,image:$image,tenant:$tenant}}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
            -d "$PAYLOAD"
