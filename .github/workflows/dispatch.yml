name: Dispatch to hetzner (staging)

# Fires a repository_dispatch at ly-schneider/hetzner for each built image.
# Dispatch contract (consumed there by bump-image.yml):
#   event_type: bump-image
#   client_payload: { service, env, digest, tag, image, tenant }
#
# Security: TAG/DIGEST come from build-images.yml outputs (runner-controlled build
# digests), and DISPATCH_TOKEN from secrets. No github.event.* user-controlled
# value flows into the run: step.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      api-digest:
        type: string
        default: ""
      web-digest:
        type: string
        default: ""
      docs-digest:
        type: string
        default: ""
      migrate-digest:
        type: string
        default: ""

concurrency:
  group: staging-deploy-comanda
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/ly-schneider/comanda
  DISPATCH_REPO: ly-schneider/hetzner
  DEPLOY_ENV: staging
  TENANT: comanda

jobs:
  dispatch:
    name: Dispatch bump-image events
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch to hetzner
        env:
          DISPATCH_TOKEN: ${{ secrets.HETZNER_DISPATCH_PAT }}
          TAG: ${{ inputs.tag }}
          API_DIGEST: ${{ inputs.api-digest }}
          WEB_DIGEST: ${{ inputs.web-digest }}
          DOCS_DIGEST: ${{ inputs.docs-digest }}
          MIGRATE_DIGEST: ${{ inputs.migrate-digest }}
        run: |
          set -euo pipefail

          dispatch() {
            local svc="$1" digest="$2"
            if [ -z "$digest" ]; then
              echo "skip $svc (no image built)"
              return 0
            fi
            local image="${IMAGE_PREFIX}-${svc}"
            local payload
            payload="$(jq -nc \
              --arg service "$svc" \
              --arg env "$DEPLOY_ENV" \
              --arg digest "$digest" \
              --arg tag "$TAG" \
              --arg image "$image" \
              --arg tenant "$TENANT" \
              '{event_type:"bump-image",client_payload:{service:$service,env:$env,digest:$digest,tag:$tag,image:$image,tenant:$tenant}}')"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
              -d "$payload"
            echo "dispatched $svc"
          }

          dispatch api "$API_DIGEST"
          dispatch web "$WEB_DIGEST"
          dispatch docs "$DOCS_DIGEST"
          dispatch migrate "$MIGRATE_DIGEST"
