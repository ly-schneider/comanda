version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * fri%2"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "area/web-app"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * fri%2"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docs-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * fri%2"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "area/backend"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * fri%2"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "area/android-app"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      android-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * fri%2"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 2
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-all:
        patterns:
          - "*"
