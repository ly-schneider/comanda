name: Generate Backend Code
description: Run Ent, OpenAPI, and Swagger code generation for the Go backend

runs:
  using: composite
  steps:
    - name: Generate Ent
      shell: bash
      working-directory: backend
      run: |
        mkdir -p ./internal/generated/ent
        echo "package ent" > ./internal/generated/ent/ent.go
        go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/modifier --feature sql/upsert --feature intercept --feature privacy --target ./internal/generated/ent ./internal/schema

    - name: Generate OpenAPI
      shell: bash
      working-directory: backend
      run: |
        npx @redocly/cli bundle openapi/openapi.yaml -o openapi/bundled.yaml
        go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1
        oapi-codegen -config oapi-codegen.yaml openapi/bundled.yaml

    # Generated sources are gitignored, so anything that runs `go mod tidy`
    # without them present — Dependabot, notably — prunes the requirements only
    # they import (kin-openapi, swag) down to indirect. Re-tidying once the
    # generated code exists puts the graph back before anything tries to build.
    - name: Tidy modules against generated code
      shell: bash
      working-directory: backend
      run: go mod tidy

    - name: Generate Swagger
      shell: bash
      working-directory: backend
      run: |
        go install github.com/swaggo/swag/cmd/swag@v1.16.6
        swag init -g cmd/backend/main.go --parseInternal --parseDependency --generatedTime=false
