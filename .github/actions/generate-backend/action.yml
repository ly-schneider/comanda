name: Generate backend code
description: Install just and run the backend's Ent, OpenAPI and Swagger generators

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Generate code
      shell: bash
      working-directory: backend
      run: just generate swag

    # Generated code must not need dependencies that go.mod is missing.
    - name: Check go.mod
      shell: bash
      working-directory: backend
      run: go mod tidy -diff
