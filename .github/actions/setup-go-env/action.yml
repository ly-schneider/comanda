name: Set up Go
description: Install the Go version from backend/go.mod with module and per-job build caches

inputs:
  cache-suffix:
    description: Keeps a separate build cache per job (lint, test, integration)
    default: build

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: backend/go.mod
        # setup-go's own cache needs an exact go.sum match; the caches below fall back across go.sum changes.
        cache: false

    - name: Cache Go modules and tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/go/bin
        key: go-mod-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Cache Go build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: go-build-${{ inputs.cache-suffix }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
        restore-keys: |
          go-build-${{ inputs.cache-suffix }}-${{ runner.os }}-
